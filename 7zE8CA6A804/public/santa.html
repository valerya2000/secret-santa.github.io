<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тайный Санта — новогодний обмен подарками</title>
<meta name="description" content="Организуйте новогодний обмен подарками в офисе или с друзьями: приглашения, вишлисты, тайная жеребьёвка.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1a33; --bg2:#0d2142; --panel:#122a52; --line:rgba(160,190,235,.16);
  --text:#f2f6ff; --muted:#9fb3d4; --red:#e5484d; --red2:#c73840; --gold:#f5c451;
  --green:#43d69a; --blue:#6cb2ff; --snow:#ffffff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text);
  font:16px/1.55 Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(56,102,178,.35), transparent 60%),
    radial-gradient(900px 500px at -10% 30%, rgba(197,56,64,.14), transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 55%, #0a1830 100%);
  background-attachment:fixed;
}
.disp{font-family:Comfortaa, Rubik, system-ui, sans-serif}
#snow{position:fixed; inset:0; z-index:0; pointer-events:none}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px; position:relative; z-index:1}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{font-family:Comfortaa, Rubik, sans-serif; line-height:1.25; margin:0 0 12px}
h1{font-size:clamp(28px,4.6vw,44px)}
h2{font-size:clamp(20px,3vw,26px)}
h3{font-size:18px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.between{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
/* garland */
.garland{display:flex; justify-content:space-between; padding:6px 6px 0; height:26px; overflow:hidden; border-top:2px solid rgba(160,190,235,.22); border-radius:2px}
.bulb{width:10px; height:14px; border-radius:50% 50% 50% 50%/40% 40% 60% 60%; animation:tw 1.9s ease-in-out infinite alternate}
.bulb:nth-child(odd){transform:translateY(3px)}
@keyframes tw{from{opacity:.5; filter:brightness(.8)}to{opacity:1; filter:brightness(1.35)}}
/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 18px; flex-wrap:wrap}
.logo{font-family:Comfortaa,sans-serif; font-weight:700; font-size:22px; color:var(--text); display:flex; gap:8px; align-items:center}
.logo:hover{text-decoration:none}
.logo b{color:var(--red)}
.top nav{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.sync{font-size:13px; color:var(--muted); border:1px solid var(--line); padding:5px 10px; border-radius:999px; cursor:help; white-space:nowrap}
/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; cursor:pointer;
  background:linear-gradient(180deg,#ef5a60,var(--red2)); color:#fff; font:600 15px Rubik,sans-serif;
  padding:12px 22px; border-radius:13px; box-shadow:0 8px 22px rgba(199,56,64,.35), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .15s, box-shadow .15s, filter .15s; text-decoration:none}
.btn:hover{transform:translateY(-2px); filter:brightness(1.07); text-decoration:none}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none; filter:none; box-shadow:none}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text); box-shadow:none}
.btn.ghost:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,#ffd97a,#e9ae2e); color:#3c2c05; box-shadow:0 8px 22px rgba(233,174,46,.3)}
.btn.green{background:linear-gradient(180deg,#4fe0a5,#22a874); color:#04281a; box-shadow:0 8px 22px rgba(34,168,116,.3)}
.btn.sm{padding:8px 14px; font-size:13px; border-radius:10px}
.btn.block{width:100%}
/* cards */
.card{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border:1px solid var(--line); border-radius:18px; padding:22px; position:relative}
.card.soft{background:rgba(10,24,48,.45)}
.empty{color:var(--muted); text-align:center; padding:22px 10px; border:1px dashed var(--line); border-radius:14px}
/* fields */
.field{margin-bottom:16px}
.lbl{display:block; font-weight:600; margin-bottom:7px}
.inp{width:100%; background:#0b1e3c; border:1px solid #2b4674; color:var(--text); border-radius:12px;
  padding:12px 14px; font:15px Rubik,sans-serif; outline:none; transition:border-color .15s}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:86px; resize:vertical}
select.inp{appearance:auto}
.hint{color:var(--muted); font-size:13px; margin-top:6px}
.err{color:#ff9ba0; font-size:13px; margin-top:6px; display:none}
.field.invalid .err{display:block}
.field.invalid .inp{border-color:var(--red)}
.money{position:relative}
.money .inp{padding-right:38px}
.money::after{content:"₽"; position:absolute; right:14px; top:12px; color:var(--gold); font-weight:700}
/* chips & badges */
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:6px; background:rgba(108,178,255,.12); border:1px solid rgba(108,178,255,.3);
  color:#cfe4ff; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:500}
.chip.gold{background:rgba(245,196,81,.12); border-color:rgba(245,196,81,.4); color:#ffe4a1}
.chip.red{background:rgba(229,72,77,.14); border-color:rgba(229,72,77,.4); color:#ffc2c5}
.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap}
.st-inv{background:rgba(159,179,212,.14); color:#c3d2ea; border:1px solid rgba(159,179,212,.3)}
.st-reg{background:rgba(108,178,255,.14); color:#a8d0ff; border:1px solid rgba(108,178,255,.35)}
.st-wait{background:rgba(245,196,81,.14); color:#ffdf9b; border:1px solid rgba(245,196,81,.4)}
.st-buy{background:rgba(190,120,255,.14); color:#dcbcff; border:1px solid rgba(190,120,255,.4)}
.st-ready{background:rgba(67,214,154,.14); color:#a9f0d2; border:1px solid rgba(67,214,154,.4)}
/* stats */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.stat{border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; background:rgba(10,24,48,.4)}
.stat .n{font-size:26px; font-weight:700; font-family:Comfortaa,sans-serif}
.stat .l{font-size:12.5px; color:var(--muted); margin-top:2px}
/* hero */
.hero{border-radius:20px; border:1px solid var(--line); overflow:hidden; position:relative; background-size:cover; background-position:center; padding:30px; margin-bottom:20px}
.hero::before{content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(7,16,34,.82) 0%, rgba(7,16,34,.55) 55%, rgba(7,16,34,.25) 100%)}
.hero>*{position:relative}
.hero .flake{position:absolute; opacity:.5; font-size:22px; animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(20deg)}}
.heroChar{position:absolute; right:22px; bottom:-6px; width:130px; opacity:.95; filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
/* avatars */
.ava{display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:linear-gradient(135deg,#e5484d,#8f1f2e);
  color:#fff; font-weight:700; flex:none; overflow:hidden; border:2px solid rgba(255,255,255,.35)}
.ava img{width:100%; height:100%; object-fit:cover}
.ava.s{width:38px; height:38px; font-size:16px}
.ava.m{width:52px; height:52px; font-size:22px}
.ava.l{width:74px; height:74px; font-size:32px}
/* steps */
.steps{display:flex; gap:8px; margin-bottom:22px}
.step{flex:1; display:flex; align-items:center; gap:9px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; color:var(--muted); font-size:13.5px; background:rgba(10,24,48,.35)}
.step .num{width:24px; height:24px; border-radius:50%; background:#22385f; color:#cfe0ff; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex:none}
.step.active{border-color:var(--gold); color:var(--text)}
.step.active .num{background:var(--gold); color:#3c2c05}
.step.done{color:#a9f0d2; cursor:pointer}
.step.done .num{background:var(--green); color:#04281a}
/* pickers */
.pick{cursor:pointer; border:2px solid transparent; border-radius:14px; transition:border-color .15s, transform .15s; position:relative; background:none; padding:0; color:var(--text); font:inherit}
.pick:hover{transform:translateY(-2px)}
.pick.sel{border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,196,81,.2)}
.pick.sel::after{content:"✓"; position:absolute; top:-8px; right:-8px; width:22px; height:22px; background:var(--gold); color:#3c2c05; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; z-index:2}
.picks{display:flex; gap:14px; flex-wrap:wrap}
.coverThumb{width:158px; height:84px; border-radius:12px; background-size:cover; background-position:center; border:1px solid var(--line)}
.charThumb{width:92px; height:92px; border-radius:14px; background:rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; padding:8px}
.charThumb svg, .charThumb img{width:100%; height:100%; object-fit:contain}
.avaThumb{width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#22385f,#14264a); display:flex; align-items:center; justify-content:center; font-size:30px; border:1px solid var(--line); overflow:hidden}
.avaThumb img{width:100%; height:100%; object-fit:cover}
.uploadTile{border:2px dashed rgba(160,190,235,.4); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--muted); font-size:12.5px; cursor:pointer; background:rgba(10,24,48,.3); text-align:center; padding:6px; transition:border-color .15s, color .15s}
.uploadTile:hover{border-color:var(--gold); color:var(--text)}
.pickName{font-size:12px; color:var(--muted); text-align:center; margin-top:6px}
/* format cards */
.fmt{flex:1; min-width:230px; text-align:left; border:2px solid var(--line); border-radius:16px; padding:16px; background:rgba(10,24,48,.35); cursor:pointer; color:var(--text); font:inherit; transition:border-color .15s}
.fmt.sel{border-color:var(--gold); background:rgba(245,196,81,.07)}
.fmt .t{font-weight:700; font-size:16px; margin-bottom:4px}
/* rte */
.toolbar{display:flex; gap:6px; margin-bottom:8px}
.rtb{width:36px; height:34px; border-radius:9px; border:1px solid var(--line); background:#0b1e3c; color:var(--text); cursor:pointer; font:600 14px Rubik,sans-serif}
.rtb:hover{border-color:var(--gold)}
.rte{min-height:120px; background:#0b1e3c; border:1px solid #2b4674; border-radius:12px; padding:12px 14px; outline:none}
.rte:focus{border-color:var(--gold)}
.rte h2, .msgView h2{font-size:19px; margin:10px 0 6px}
.msgView{background:rgba(10,24,48,.4); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
/* players */
.prow{display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--line); border-radius:14px; background:rgba(10,24,48,.35); margin-bottom:8px; flex-wrap:wrap}
.pinfo{flex:1; min-width:160px}
.pname{font-weight:600}
.excl-chip{display:inline-flex; align-items:center; gap:8px; background:rgba(229,72,77,.1); border:1px solid rgba(229,72,77,.35); color:#ffc9cc; padding:6px 10px; border-radius:999px; font-size:13px}
.excl-chip button{background:none; border:0; color:#ff9ba0; cursor:pointer; font-size:15px; padding:0 2px}
/* timeline */
.tl{display:flex; margin:18px 0 22px}
.tl-node{flex:1; text-align:center; position:relative; font-size:12px; color:var(--muted)}
.tl-node::before{content:""; position:absolute; top:13px; left:-50%; width:100%; height:2px; background:#22385f}
.tl-node:first-child::before{display:none}
.tl-dot{width:28px; height:28px; margin:0 auto 6px; border-radius:50%; background:#22385f; color:#cfe0ff; display:flex; align-items:center; justify-content:center; font-size:13px; position:relative; z-index:1; border:2px solid #0d2142}
.tl-node.done{color:#a9f0d2}
.tl-node.done .tl-dot{background:var(--green); color:#04281a}
.tl-node.done::before{background:var(--green)}
.tl-node.cur{color:var(--text); font-weight:600}
.tl-node.cur .tl-dot{background:var(--gold); color:#3c2c05; box-shadow:0 0 0 5px rgba(245,196,81,.18)}
/* reveal */
.reveal{background:linear-gradient(135deg, rgba(229,72,77,.22), rgba(245,196,81,.14)); border:1px solid rgba(245,196,81,.45); border-radius:18px; padding:24px; text-align:center}
.reveal .who{font-family:Comfortaa,sans-serif; font-size:clamp(24px,4vw,34px); font-weight:700; color:#ffe4a1; margin:8px 0}
.reveal .who-label{color:var(--muted); font-size:14.5px; letter-spacing:.4px}
.secret{border:1px dashed rgba(160,190,235,.4); border-radius:12px; padding:12px 14px; color:var(--muted); font-size:13.5px; background:rgba(10,24,48,.3)}
.progress{height:10px; background:#1a3057; border-radius:999px; overflow:hidden; margin-top:8px}
.progressBar{height:100%; background:linear-gradient(90deg,#4fe0a5,#22a874); border-radius:999px; transition:width .4s}
/* modal & toast */
.overlay{position:fixed; inset:0; background:rgba(4,10,24,.72); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px}
.modal{width:100%; max-width:560px; max-height:88vh; overflow:auto; background:linear-gradient(180deg,#152e58,#0f2347); border:1px solid rgba(160,190,235,.3); border-radius:18px; padding:22px; animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94); opacity:0}to{transform:scale(1); opacity:1}}
.mhead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
.mclose{background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; line-height:1}
.mclose:hover{color:#fff}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:#152e58; border:1px solid rgba(245,196,81,.5); color:var(--text); padding:12px 20px; border-radius:13px; z-index:70; opacity:0; transition:all .25s; box-shadow:0 12px 30px rgba(0,0,0,.45); max-width:92vw; text-align:center; font-size:14.5px}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.conf{position:fixed; top:-30px; z-index:65; pointer-events:none; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(680deg)}}
/* misc */
.wl-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:11px; margin-bottom:7px; background:rgba(10,24,48,.35)}
.wl-item .t{flex:1}
.invite-input{font-size:13px; color:#cfe4ff}
.demo-note{border:1px solid rgba(108,178,255,.3); background:rgba(108,178,255,.07); border-radius:12px; padding:11px 14px; font-size:13px; color:#bcd7ff}
.danger{border-color:rgba(229,72,77,.4)}
.foot{margin:44px 0 30px; text-align:center; color:var(--muted); font-size:13px}
.trees{display:block; width:100%; height:74px; margin-bottom:10px; opacity:.9}
.boot{padding:80px 0; text-align:center; color:var(--muted); font-size:18px}
.gameCard{display:flex; gap:14px; align-items:center; padding:14px; border:1px solid var(--line); border-radius:16px; background:rgba(10,24,48,.35); margin-bottom:10px; flex-wrap:wrap}
.gameThumb{width:86px; height:60px; border-radius:10px; background-size:cover; background-position:center; flex:none; border:1px solid var(--line)}
.howIco{font-size:30px; margin-bottom:8px}
.charRow{display:flex; gap:6px; justify-content:center; margin-top:18px}
.charRow>div{width:74px; height:74px; opacity:.95}
.charRow svg{width:100%; height:100%}
.qa{border-left:3px solid var(--gold); padding:8px 14px; background:rgba(245,196,81,.06); border-radius:0 10px 10px 0; margin-bottom:10px}
.qa .q{font-size:12.5px; color:var(--muted); margin-bottom:2px}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
@media (max-width:860px){
  .grid2,.grid3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{padding:22px}
  .heroChar{width:92px; right:12px}
  .step .stLabel{display:none}
  .coverThumb{width:calc(50% - 8px)}
}
@media (prefers-reduced-motion:reduce){
  .bulb,.hero .flake,.conf{animation:none !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="garland" id="garland" aria-hidden="true"></div>
  <header class="top">
    <a class="logo" href="#/">🎅 Тайный<b>Санта</b></a>
    <nav>
      <a href="#/">Мои игры</a>
      <a class="btn sm" href="#/create">＋ Создать игру</a>
      <span class="sync" id="syncBadge" title="">💾</span>
    </nav>
  </header>
  <main id="app"><div class="boot">Загружаем снег… ❄️</div></main>
  <footer class="foot">
    <svg class="trees" viewBox="0 0 1080 74" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <g fill="#12294e"><polygon points="60,74 92,20 124,74"/><polygon points="180,74 205,34 230,74"/><polygon points="860,74 892,16 924,74"/><polygon points="980,74 1005,36 1030,74"/></g>
      <g fill="#1a3a6b"><polygon points="0,74 26,30 52,74"/><polygon points="120,74 148,26 176,74"/><polygon points="920,74 948,28 976,74"/><polygon points="1028,74 1054,32 1080,74"/></g>
      <circle cx="92" cy="18" r="4" fill="#f5c451"/><circle cx="892" cy="14" r="4" fill="#f5c451"/>
      <rect x="0" y="72" width="1080" height="2" fill="#22385f"/>
    </svg>
    <p>Сделано с ❤️ и мандаринами · <a id="dlLink" href="santa.html" download="тайный-санта.html">⬇️ Скачать сайт одним HTML-файлом</a></p>
    <p class="tiny">Прототип: игры хранятся в localStorage вашего браузера, а при открытии с сервера — резервируются в базе данных. Назначения жеребьёвки скрыты от всех, кроме самого Санты 🤫</p>
  </footer>
</div>
<input type="file" id="fileAvatar" accept="image/*" hidden>
<input type="file" id="fileCover" accept="image/*" hidden>
<input type="file" id="fileChar" accept="image/*" hidden>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<noscript><div style="padding:30px;text-align:center">Для игры «Тайный Санта» нужен включённый JavaScript 🎄</div></noscript>
<script>
'use strict';
/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID().slice(0, 13) : 'id-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const addDays = (str, n) => { const d = new Date(str + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtD = str => { if (!str) return '—'; const d = new Date(str + 'T12:00:00'); const o = { day: 'numeric', month: 'long' }; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return new Intl.DateTimeFormat('ru-RU', o).format(d); };

const LS = 'ts_state_v1', LSW = 'ts_ws_v1';
const API = /^https?:$/.test(location.protocol) ? '/api/state' : null;
let state = { games: [] };

function writeLocal() { try { localStorage.setItem(LS, JSON.stringify({ data: state, updatedAt: meta.updatedAt })); } catch (e) { toast('Хранилище браузера переполнено — попробуйте изображения поменьше 😅'); } }

  try { const raw = localStorage.getItem(LS); if (raw) { const j = JSON.parse(raw); if (j && j.data && Array.isArray(j.data.games)) { state = j.data; meta.updatedAt = j.updatedAt || 0; } } } catch (e) {}
}

  ws = fromUrl || localStorage.getItem(LSW) || uid() + uid().slice(0, 4);
  try { localStorage.setItem(LSW, ws); } catch (e) {}
}
async function pull() {
  if (!API || !ws) return false;
  try {
    const res = await fetch(API + '/' + encodeURIComponent(ws), { cache: 'no-store' });
    if (!res.ok) throw new Error('bad');
    const j = await res.json();
    apiOK = true;
    if (j && j.data && Array.isArray(j.data.games) && (j.updatedAt || 0) > meta.updatedAt) {
      state = j.data; meta.updatedAt = j.updatedAt; writeLocal(); updateSyncBadge(); return true;

  } catch (e) { apiOK = false; updateSyncBadge(); return false; }
}

}
async function push() {
  if (!API || !ws) return;

    const res = await fetch(API + '/' + encodeURIComponent(ws), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: state, updatedAt: meta.updatedAt }) });

function computeAssignments(ids, excluded) {
  const givers = shuffle(ids);
  const result = {}; const used = new Set();
  function bt(i) {
    if (i === givers.length) return true;
    const g = givers[i];
    const cands = shuffle(ids.filter(r => !used.has(r) && r !== g && !excluded.has(pairKey(g, r))));
    for (const r of cands) {
      result[g] = r; used.add(r);
      if (bt(i + 1)) return true;
      used.delete(r); delete result[g];
    }
    return false;
  }
  return bt(0) ? result : null;
}

  if (todayStr() < g.drawDate) return { ok: false, reason: 'Кнопка откроется ' + fmtD(g.drawDate) + ' — в день жеребьёвки.' };
  const ex = exclSet(g);
  for (const p of j) {
    const options = j.filter(o => o.id !== p.id && !ex.has(pairKey(p.id, o.id)));

async function saveProfile(gid, pid, fields) {
  await freshen();
  const g = getGame(gid); const p = getPlayer(g, pid); if (!p) throw new Error('Игрок не найден');
  const wish = (fields.wish || '').trim();
  if (wish.length < 4) throw new Error('Подсказка Санте — не меньше 4 символов 🙂');
  if (g.format === 'online' && !(fields.address || '').trim()) throw new Error('Укажите адрес доставки — игра проходит онлайн 📦');
  p.wish = wish; p.anti = (fields.anti || '').trim(); p.address = (fields.address || '').trim();
  if (p.status === 'registration' || p.status === 'waiting') p.status = g.assignments ? 'buying' : 'waiting';
  persist();
}
async function runDraw(gid) {
  await freshen();
  const g = getGame(gid); if (!g) throw new Error('Игра не найдена');
  const chk = canDraw(g); if (!chk.ok) throw new Error(chk.reason);
  const j = joined(g);
  const map = computeAssignments(j.map(p => p.id), exclSet(g));
  if (!map) throw new Error('С текущими исключениями пары не складываются — уберите часть исключённых пар и попробуйте снова.');
  g.assignments = map; g.drawnAt = new Date().toISOString();
  j.forEach(p => { p.status = 'buying'; });
  persist();
  return map;
}
async function markReady(gid, pid, ready) {
  await freshen();
  const g = getGame(gid); const p = getPlayer(g, pid); if (!p) throw new Error('Игрок не найден');
  if (!g.assignments) throw new Error('Жеребьёвка ещё не проведена');
  p.status = ready ? 'ready' : 'buying';
  p.readyAt = ready ? new Date().toISOString() : null;
  persist();
}

/* ================= санитайзер сообщения ================= */
function cleanHTML(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html || '');
  const ALLOW = new Set(['B', 'STRONG', 'I', 'EM', 'H2', 'BR', 'P', 'DIV', 'UL', 'OL', 'LI']);
  (function walk(node) {
    const kids = Array.from(node.childNodes);
    for (const k of kids) {
      if (k.nodeType === 1) {
        if (k.tagName === 'SCRIPT' || k.tagName === 'STYLE' || k.tagName === 'IFRAME') { k.remove(); continue; }
        walk(k);
        for (const a of Array.from(k.attributes)) k.removeAttribute(a.name);
        if (!ALLOW.has(k.tagName)) { while (k.firstChild) node.insertBefore(k.firstChild, k); k.remove(); }
      } else if (k.nodeType !== 3) k.remove();
    }
  })(t.content);
  return t.innerHTML;
}

function syncDraft() {
  if (!draft) return;
  const n = $('#wName'); if (n) draft.name = n.value;
  const b = $('#wBudget'); if (b) draft.budget = b.value === '' ? '' : Number(b.value);
  const d = $('#wDraw'); if (d) draft.drawDate = d.value;
  const dl = $('#wDeadline'); if (dl) draft.deadline = dl.value;
  const r = $('#rte'); if (r) draft.message = r.innerHTML;

function validateStep1() {
  syncDraft();
  let ok = true;
  const mark = (id, bad, msg) => { const inp = $('#' + id); if (!inp) return; const f = inp.closest('.field'); f.classList.toggle('invalid', bad); if (bad) { f.querySelector('.err').textContent = msg; ok = false; } };

  mark('wBudget', !(Number(draft.budget) > 0), 'Укажите сумму больше нуля — Санте нужен ориентир.');
  mark('wDraw', !draft.drawDate, 'Выберите дату жеребьёвки.');
  mark('wDeadline', !draft.deadline || (draft.drawDate && draft.deadline < draft.drawDate), 'Дедлайн покупки не может быть раньше даты жеребьёвки.');

      '<div class="hint mt8">Можно создать игру и без списка — просто поделитесь ссылкой-приглашением.</div></div>' +

  }
  return '<div class="between mb16"><h1 style="margin:0">Новая игра</h1><a href="#/" class="muted small">← к моим играм</a></div><div class="steps">' + steps + '</div>' + body;
}

/* ---- панель организатора ---- */

  const url = inviteUrl(g);

    '<input class="inp invite-input" id="inviteLink" readonly value="' + esc(url) + '">' +

    '<div class="hint mt8">' + (API ? 'Ссылка работает между устройствами: данные игры синхронизируются с сервером.' : 'Файл открыт без сервера: ссылка сработает в этом же браузере (данные в localStorage).') + '</div></div>';

      '<button class="btn block" data-action="draw-open" data-id="' + g.id + '" ' + (chk.ok ? '' : 'disabled') + '>Провести жеребьёвку 🎲</button>' +

      '<div class="secret">🤫 Назначения скрыты даже от организатора — каждый видит только своего получателя.</div></div>';
  }

    (g.players.length ? g.players.map(p =>
      '<div class="prow">' + (p.status === 'invited' ? '<span class="ava s" style="background:#22385f">' + esc(initials(p.name)) + '</span>' : '<span class="ava s">' + esc(initials(p.name)) + '</span>') +

function vNotFound() {
  return '<div class="card" style="text-align:center;padding:40px"><div style="font-size:44px">🎄</div><h2>Игра не найдена</h2><p class="muted">Возможно, ссылка открыта в другом браузере без данных прототипа, или игра была удалена.</p><a class="btn" href="#/">На главную</a></div>';
}

/* ================= роутер ================= */
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('?');
  return { path: parts[0].split('/').filter(Boolean), q: new URLSearchParams(parts[1] || '') };
}
let lastPath = '';
function render() {
  const r = parseHash();
  const [a, b, c] = r.path;
  let html = ''; let title = 'Тайный Санта';
  if (!a) html = vHome();
  else if (a === 'create') { html = vWizard(); title = 'Новая игра — Тайный Санта'; }
  else if (a === 'game' && b) { const g = getGame(b); html = g ? vDash(g) : vNotFound(); if (g) title = g.name + ' — управление'; }
  else if (a === 'invite' && b) { const g = getGame(b); html = g ? vInvite(g) : vNotFound(); if (g) title = g.name + ' — приглашение'; }
  else if (a === 'player' && b && c) { const g = getGame(b); const p = getPlayer(g, c); html = (g && p) ? vPlayer(g, p, r.q.get('edit') === '1') : vNotFound(); if (g && p) title = g.name + ' — кабинет игрока'; }
  else html = vNotFound();
  $('#app').innerHTML = html;
  document.title = title;
  updateSyncBadge();
  const dl = $('#dlLink'); if (dl) dl.href = location.protocol === 'file:' ? location.href.split('#')[0] : 'santa.html';
  const pathKey = r.path.join('/');
  if (pathKey !== lastPath) { window.scrollTo(0, 0); lastPath = pathKey; }
}

/* ================= модалки / тосты / конфетти ================= */
function openModal(html) { $('#modalRoot').innerHTML = '<div class="overlay" id="overlay"><div class="modal">' + html + '</div></div>'; }
function closeModal() { $('#modalRoot').innerHTML = ''; }
function mhead(title) { return '<div class="mhead"><h3 style="margin:0">' + title + '</h3><button class="mclose" data-action="modal-close" aria-label="Закрыть">✕</button></div>'; }
let toastTimer = null;
function toast(msg) {
  const r = $('#toastRoot'); if (!r) return;
  r.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  const t = r.firstChild;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => { if (t.parentNode) t.remove(); }, 300); }, 2800);
}
function confetti() {
  if (reducedMotion()) return;
  const emo = ['🎁', '❄️', '🎄', '⭐', '🍬', '✨'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = emo[i % emo.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 14 + Math.random() * 18 + 'px';
    s.style.animationDuration = 2.4 + Math.random() * 2 + 's';
    s.style.animationDelay = Math.random() * 0.7 + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
    setTimeout(() => { if (s.parentNode) s.remove(); }, 6000);
  }
}
function openWishlist(gid, pid) {
  const g = getGame(gid); const p = getPlayer(g, pid); if (!p) return;
  const list = p.wishlist.length
    ? p.wishlist.map((w, i) => '<div class="wl-item"><span>🎁</span><span class="t">' + esc(w.title) + (w.note ? '<div class="muted tiny">' + esc(w.note) + '</div>' : '') + '</span><button class="btn sm ghost" data-action="wl-del" data-g="' + gid + '" data-p="' + pid + '" data-i="' + i + '">✕</button></div>').join('')
    : '<div class="empty">Пока пусто. Добавьте идеи — ваш Санта скажет спасибо 😉</div>';
  openModal(mhead('🎁 Мой вишлист') +
    '<p class="muted small">Идеи подарков увидит ваш тайный Санта. <span data-wl-count="' + pid + '">В вишлисте игры: <b>' + p.wishlist.length + '</b> ' + plural(p.wishlist.length, ['подарок', 'подарка', 'подарков']) + '</span></p>' +
    '<div id="wlList">' + list + '</div>' +
    '<form data-form="wl" data-g="' + gid + '" data-p="' + pid + '" class="mt12">' +
    '<div class="field" style="margin-bottom:8px"><input class="inp" id="wlTitle" maxlength="120" placeholder="Например: тёплые носки с оленями"></div>' +
    '<div class="field" style="margin-bottom:8px"><input class="inp" id="wlNote" maxlength="200" placeholder="Ссылка или комментарий (необязательно)"></div>' +
    '<button class="btn block" type="submit">＋ Добавить подарок</button></form>');
}
function refreshWlCounters(pid) {
  const g = state.games.find(x => x.players.some(p => p.id === pid));
  const p = g && getPlayer(g, pid); if (!p) return;
  document.querySelectorAll('[data-wl-count="' + pid + '"]').forEach(el => {
    el.innerHTML = 'В вишлисте игры: <b>' + p.wishlist.length + '</b> ' + plural(p.wishlist.length, ['подарок', 'подарка', 'подарков']);
  });
}
function confirmModal(title, text, action, attrs, btnLabel) {
  openModal(mhead(title) + '<p class="muted">' + text + '</p><div class="row mt16" style="justify-content:flex-end"><button class="btn ghost" data-action="modal-close">Отмена</button><button class="btn" data-action="' + action + '" ' + attrs + '>' + btnLabel + '</button></div>');
}

/* ================= загрузка изображений ================= */
function readImage(file, maxDim) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('read'));
    fr.onload = () => {
      const raw = fr.result;
      try {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = Math.max(1, Math.round(img.width * scale));
            cv.height = Math.max(1, Math.round(img.height * scale));
            const ctx = cv.getContext('2d');
            if (!ctx) { resolve(raw); return; }
            ctx.drawImage(img, 0, 0, cv.width, cv.height);
            const png = file.type === 'image/png' || file.type === 'image/svg+xml';
            resolve(cv.toDataURL(png ? 'image/png' : 'image/jpeg', 0.86));
          } catch (e) { resolve(raw); }
        };
        img.onerror = () => resolve(raw);
        img.src = raw;
      } catch (e) { resolve(raw); }
    };
    fr.readAsDataURL(file);
  });
}

/* ================= события ================= */
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('[data-action="rte"]')) e.preventDefault(); });
document.addEventListener('input', e => { if (e.target.id === 'rte') draft.message = e.target.innerHTML; });
document.addEventListener('click', async e => {
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) {
    if (e.target.id === 'overlay') closeModal();
    return;
  }
  const act = el.dataset.action;
  try {
    switch (act) {
      case 'seed-demo': seedDemo(); break;
      case 'refresh': await freshen(); render(); toast('Данные обновлены 🔄'); break;
      case 'modal-close': closeModal(); break;
      case 'del-game': {
        const g = getGame(el.dataset.id); if (!g) break;
        confirmModal('Удалить игру?', '«' + esc(g.name) + '» исчезнет вместе со всеми игроками и назначениями. Отменить нельзя.', 'del-game-yes', 'data-id="' + g.id + '"', '🗑 Удалить');
        break;
      }
      case 'del-game-yes': deleteGame(el.dataset.id); closeModal(); location.hash = '#/'; render(); toast('Игра удалена'); break;
      case 'copy-invite': {
        const g = getGame(el.dataset.id); if (!g) break;
        const url = inviteUrl(g);
        let ok = false;
        try { await navigator.clipboard.writeText(url); ok = true; } catch (err) {
          const inp = $('#inviteLink'); if (inp) { inp.select(); try { ok = document.execCommand('copy'); } catch (e2) {} }
        }
        toast(ok ? 'Ссылка скопирована ✨ Отправьте её игрокам!' : 'Скопируйте ссылку из поля вручную');
        break;
      }
      /* мастер */
      case 'wiz-go': syncDraft(); draft.step = Number(el.dataset.step); render(); break;
      case 'wiz-back': syncDraft(); draft.step = Math.max(1, draft.step - 1); render(); break;
      case 'wiz-next':
        if (draft.step === 1 && !validateStep1()) { toast('Проверьте выделенные поля 🙂'); break; }
        syncDraft(); draft.step = Math.min(3, draft.step + 1); render(); break;
      case 'pick-format': syncDraft(); draft.format = el.dataset.val; render(); break;
      case 'pick-avatar': syncDraft(); draft.avatar = el.dataset.val === 'custom' ? draft.avatar : { preset: el.dataset.val }; render(); break;
      case 'pick-cover': syncDraft(); if (el.dataset.val !== 'custom') draft.cover = el.dataset.val; render(); break;
      case 'pick-char': syncDraft(); if (el.dataset.val !== 'custom') draft.character = el.dataset.val; render(); break;
      case 'upload-avatar': $('#fileAvatar').click(); break;
      case 'upload-cover': $('#fileCover').click(); break;
      case 'upload-char': $('#fileChar').click(); break;
      case 'rte': {
        const r = $('#rte'); if (!r) break;
        r.focus();
        const cmd = el.dataset.cmd;
        if (cmd === 'h2') {
          const cur = (document.queryCommandValue('formatBlock') || '').toLowerCase();
          document.execCommand('formatBlock', false, cur === 'h2' ? 'p' : 'h2');
        } else document.execCommand(cmd, false, null);
        draft.message = r.innerHTML;
        break;
      }
      case 'import-past': {
        syncDraft();
        const sel = $('#pastSelect'); const g = sel && getGame(sel.value);
        if (!g) { toast('Сначала выберите прошлую игру'); break; }
        let added = 0;
        g.players.forEach(p => {
          const em = (p.email || '').toLowerCase();
          if (em && !draft.invited.some(x => x.email.toLowerCase() === em)) { draft.invited.push({ name: p.name, email: p.email }); added++; }
        });
        render();
        toast(added ? 'Добавлено ' + added + ' ' + plural(added, ['участник', 'участника', 'участников']) + ' из прошлой игры 🎉' : 'Все участники этой игры уже в списке');
        break;
      }
      case 'rm-invited': syncDraft(); draft.invited.splice(Number(el.dataset.i), 1); render(); break;
      case 'create-game': createGameFromDraft(); break;
      /* приглашение */
      case 'join-start': {
        const card = $('#joinCard');
        if (card) { card.style.display = 'block'; card.scrollIntoView({ behavior: 'smooth', block: 'center' }); const n = $('#jName'); if (n) setTimeout(() => n.focus(), 350); }
        break;
      }
      /* организатор: жеребьёвка и игроки */
      case 'draw-open': {
        const g = getGame(el.dataset.id); if (!g) break;
        const unfilled = joined(g).filter(p => !p.wish).length;
        confirmModal('Провести жеребьёвку? 🎲', 'Каждый игрок узнает только своего получателя — отменить жеребьёвку нельзя.' + (unfilled ? ' Внимание: ' + unfilled + ' ' + plural(unfilled, ['игрок', 'игрока', 'игроков']) + ' ещё без подсказок в анкете.' : ''), 'draw-yes', 'data-id="' + g.id + '"', 'Провести 🎲');
        break;
      }
      case 'draw-yes': {
        closeModal();
        const gid = el.dataset.id;
        await runDraw(gid);
        render(); confetti();
        toast('Жеребьёвка проведена! Все игроки уже знают, кому дарят 🎁');
        break;
      }
      case 'excl-add': {
        const g = getGame(el.dataset.g); if (!g) break;
        const a = $('#exA').value, b = $('#exB').value;
        if (a === b) { toast('Выберите двух разных игроков 🙂'); break; }
        g.exclusions = g.exclusions || [];
        if (g.exclusions.some(pr => pairKey(pr[0], pr[1]) === pairKey(a, b))) { toast('Такая пара уже исключена'); break; }
        g.exclusions.push([a, b]); persist(); render(); toast('Пара исключена ✂️');
        break;
      }
      case 'excl-del': { const g = getGame(el.dataset.g); if (!g) break; g.exclusions.splice(Number(el.dataset.i), 1); persist(); render(); break; }
      case 'rm-player': {
        const g = getGame(el.dataset.g); if (!g || g.assignments) break;
        const pid = el.dataset.p;
        g.players = g.players.filter(p => p.id !== pid);
        g.exclusions = (g.exclusions || []).filter(pr => pr[0] !== pid && pr[1] !== pid);
        persist(); render(); toast('Игрок убран из игры');
        break;
      }
      /* игрок */
      case 'ready': await markReady(el.dataset.g, el.dataset.p, true); render(); confetti(); toast('Ура! Статус: «Готов подарить» 🎉'); break;
      case 'unready': await markReady(el.dataset.g, el.dataset.p, false); render(); break;
      case 'open-wl': openWishlist(el.dataset.g, el.dataset.p); break;
      case 'wl-del': {
        const g = getGame(el.dataset.g); const p = getPlayer(g, el.dataset.p); if (!p) break;
        p.wishlist.splice(Number(el.dataset.i), 1); persist();
        openWishlist(el.dataset.g, el.dataset.p); refreshWlCounters(el.dataset.p);
        break;
      }
    }
  } catch (err) {
    toast(err && err.message ? err.message : 'Что-то пошло не так 😅');
  }
});
document.addEventListener('submit', async e => {
  const form = e.target.closest ? e.target.closest('form[data-form]') : null;
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const setErr = (inp, msg) => { const f = inp.closest('.field'); if (!f) return; f.classList.toggle('invalid', !!msg); const er = f.querySelector('.err'); if (er && msg) er.textContent = msg; };
  try {
    if (kind === 'email') {
      syncDraft();
      const inp = $('#emailInp'); const em = inp.value.trim().toLowerCase();
      const errEl = $('#emailErr');
      const bad = !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
      const dup = draft.invited.some(x => x.email.toLowerCase() === em);
      errEl.style.display = bad || dup ? 'block' : 'none';
      errEl.textContent = bad ? 'Похоже, это не email — проверьте адрес 🙂' : dup ? 'Этот email уже в списке' : '';
      if (bad || dup) return;
      draft.invited.push({ name: prettyName(em), email: em });
      render();
      toast('Игрок добавлен в список приглашённых ✉️');
    } else if (kind === 'join') {
      const nameI = $('#jName'), emailI = $('#jEmail');
      const name = nameI.value.trim(), em = emailI.value.trim();
      let ok = true;
      if (name.length < 2) { setErr(nameI, 'Представьтесь, пожалуйста — хотя бы 2 символа.'); ok = false; } else setErr(nameI, '');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { setErr(emailI, 'Нужен корректный email.'); ok = false; } else setErr(emailI, '');
      if (!ok) return;
      const { p, isNew } = await joinGame(form.dataset.g, name, em);
      location.hash = '#/player/' + form.dataset.g + '/' + p.id;
      render();
      toast(isNew ? 'Добро пожаловать, ' + p.name.split(' ')[0] + '! Заполните анкету 📝' : 'С возвращением, ' + p.name.split(' ')[0] + '! 👋');
    } else if (kind === 'profile') {
      const wishI = $('#pWish');
      const wish = wishI.value.trim();
      if (wish.length < 4) { setErr(wishI, 'Не меньше 4 символов — Санте нужна подсказка 🙂'); return; }
      setErr(wishI, '');
      const addrI = $('#pAddr');
      if (addrI && !addrI.value.trim()) { setErr(addrI, 'Укажите адрес доставки — игра онлайн 📦'); return; }
      if (addrI) setErr(addrI, '');
      await saveProfile(form.dataset.g, form.dataset.p, { wish, anti: $('#pAnti').value, address: addrI ? addrI.value : '' });
      location.hash = '#/player/' + form.dataset.g + '/' + form.dataset.p;
      render();
      toast('Анкета сохранена ✨');
    } else if (kind === 'wl') {
      const g = getGame(form.dataset.g); const p = getPlayer(g, form.dataset.p); if (!p) return;
      const t = $('#wlTitle').value.trim();
      if (t.length < 2) { toast('Напишите идею подарка — хотя бы 2 символа'); return; }
      p.wishlist.push({ id: uid(), title: t, note: $('#wlNote').value.trim() });
      persist();
      openWishlist(form.dataset.g, form.dataset.p);
      refreshWlCounters(form.dataset.p);
      toast('Идея добавлена в вишлист 🎁');
    }
  } catch (err) {
    toast(err && err.message ? err.message : 'Что-то пошло не так 😅');
  }
});
document.addEventListener('change', async e => {
  const id = e.target.id;
  if (id !== 'fileAvatar' && id !== 'fileCover' && id !== 'fileChar') return;
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Нужен файл-изображение 🙂'); return; }
  try {
    syncDraft();
    if (id === 'fileAvatar') draft.avatar = { data: await readImage(file, 300) };
    if (id === 'fileCover') draft.cover = await readImage(file, 1200);
    if (id === 'fileChar') draft.character = await readImage(file, 400);
    render();
    toast('Изображение загружено ✨');
  } catch (err) { toast('Не удалось прочитать файл 😅'); }
});
window.addEventListener('storage', e => {
  if (e.key !== LS) return;
  loadLocal();
  const ae = document.activeElement;
  const busy = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable);
  const r = parseHash();
  if (!busy && r.path[0] !== 'create' && !$('#overlay')) render();
});
window.addEventListener('hashchange', async () => {
  const r = parseHash();
  const wsQ = r.q.get('ws');
  if (API && wsQ && wsQ !== ws) { ensureWs(wsQ); await pull().catch(() => false); }
  render();
});

/* ================= снег и гирлянда ================= */
function initGarland() {
  const g = $('#garland'); if (!g) return;
  const cols = ['#ff6b6e', '#f5c451', '#5fe0a5', '#6cb2ff', '#ffffff'];
  let html = '';
  for (let i = 0; i < 26; i++) {
    const c = cols[i % cols.length];
    html += '<span class="bulb" style="background:' + c + ';box-shadow:0 0 10px 2px ' + c + '66;animation-delay:' + (i * 0.17).toFixed(2) + 's"></span>';
  }
  g.innerHTML = html;
}
function initSnow() {
  const cv = $('#snow'); if (!cv || reducedMotion()) return;
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  let W = 0, H = 0, flakes = [];
  function resize() {
    W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
    const n = Math.min(110, Math.floor(W / 12));
    flakes = [];
    for (let i = 0; i < n; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.6, vy: 0.4 + Math.random() * 1.1, ph: Math.random() * Math.PI * 2, amp: 0.4 + Math.random() * 0.9 });
  }
  resize();
  window.addEventListener('resize', resize);
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const f of flakes) {
      f.ph += 0.01; f.y += f.vy; f.x += Math.sin(f.ph) * f.amp * 0.6;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x > W + 6) f.x = -6; if (f.x < -6) f.x = W + 6;
      ctx.globalAlpha = 0.35 + f.r / 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
}

/* ================= старт ================= */
(async function boot() {
  loadLocal();
  const r = parseHash();
  if (API) { ensureWs(r.q.get('ws')); await pull().catch(() => false); }
  render();
  initGarland();
  try { initSnow(); } catch (e) {}
  window.__ts = {
    get state() { return state; },
    get ws() { return ws; },
    seedDemo, runDraw, joinGame, saveProfile, markReady, computeAssignments, canDraw,
    go(h) { location.hash = h; }, render
  };
})();
